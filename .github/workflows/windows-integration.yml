name: Windows Integration

# 仅手动触发；不是必过检查。用于跑需要真实 Windows 环境的测试（如杀进程测试）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-integration:
    name: windows-integration (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DeskBox.sln

      - name: Build (Release)
        run: dotnet build DeskBox.sln -c Release --no-restore

      - name: Test (Category=WindowsIntegration)
        shell: pwsh
        run: |
          # 匹配到 0 条、或只跳过不执行，都必须失败（看 trx 的 executed，不算 notExecuted）。
          # 不再把 VSTest 退出码 8（零测试）当成成功。
          dotnet test DeskBox.sln -c Release --no-build `
            --filter "Category=WindowsIntegration" `
            --logger trx --results-directory TestResults
          $code = $LASTEXITCODE
          if ($code -ne 0 -and $code -ne 8) { exit $code }

          $trxFiles = Get-ChildItem -Path TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue
          if (-not $trxFiles) {
            Write-Error 'No .trx files found under TestResults; refusing green with zero evidence.'
            exit 1
          }

          $executed = 0
          foreach ($f in $trxFiles) {
            [xml]$xml = Get-Content -Raw $f.FullName
            $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
            $counters = Select-Xml -Xml $xml -XPath '//t:Counters' -Namespace $ns | ForEach-Object { $_.Node }
            if (-not $counters) { $counters = Select-Xml -Xml $xml -XPath '//Counters' | ForEach-Object { $_.Node } }
            foreach ($c in $counters) {
              $executed += [int]$c.executed
            }
          }

          Write-Output "TRX executed (sum across files)=$executed"
          if ($executed -le 0) {
            Write-Error "WindowsIntegration gate failed: trx executed=$executed (skipped/notExecuted do not count). At least one test must actually run."
            exit 1
          }
          if ($code -eq 8) {
            Write-Error "dotnet test exit code 8 (no matching tests) but gate requires executed>0."
            exit 1
          }
          exit $code

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-integration-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
